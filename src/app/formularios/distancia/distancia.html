<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <form>
                        <div class="form-group pt-4">
                            <label for="x1">Coordenada 1 (x):</label>
                            <input [(ngModel)]="x1" name="x1" type="text" class="form-control" 
                            id="x1" placeholder="Ingrese coordenada 1 (x)">
                        </div>
                        <div class="form-group pt-4">
                            <label for="y1">Coordenada 1 (y):</label>
                            <input [(ngModel)]="y1" name="y1" type="text" class="form-control" 
                            id="y1" placeholder="Ingrese coordenada 1 (y)">
                        </div>
                        <br>
                        <div class="form-group pt-4">
                            <label for="x2">Coordenada 2 (x):</label>
                            <input [(ngModel)]="x2" name="x2" type="text" class="form-control" 
                            id="x2" placeholder="Ingrese coordenada 2 (x)">
                        </div>
                        <div class="form-group pt-4">
                            <label for="y2">Coordenada 1 (y):</label>
                            <input [(ngModel)]="y2" name="y2" type="text" class="form-control" 
                            id="y2" placeholder="Ingrese coordenada 2 (y)">
                        </div>
                         <br>
                            
                        <button (click)="coordenada()" type="button" class="btn btn-primary">
                            Calcular distancia
                        </button>
                    </form>
                </div>
                <div class="col-6">
                    <h3>Resultado: {{distanciacalcu}} </h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
