<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <form>
                        <div class="form-group pt-4">
                            <label for="Fnum1">Número 1:</label>
                            <input [(ngModel)]="Fnum1" name="Fnum1" type="text" class="form-control" 
                            id="Fnum1" placeholder="Ingrese número 1">
                        </div>
                        <div class="form-group pt-4">
                            <label for="Fnum2">Número 2:</label>
                            <input [(ngModel)]="Fnum2" name="Fnum2" type="text" class="form-control" 
                            id="Fnum2" placeholder="Ingrese número 2">
                        </div>
                        <br>
                        
                        <div class="form-check form-check-inline">
                                <input class="form-check-input" name="triangulo" type="radio" value="triangulo" [(ngModel)]="calculo">
                                <label class="form-check-label" for="triangulo">Triangulo</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" name="rectangulo" type="radio" value="rectangulo" [(ngModel)]="calculo">
                                <label class="form-check-label" for="rectangulo">Rectángulo</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" name="circulo" type="radio" value="circulo" [(ngModel)]="calculo">
                                <label class="form-check-label" for="circulo">Circulo</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" name="pentagono" type="radio" value="pentagono" [(ngModel)]="calculo">
                                <label class="form-check-label" for="pentagono">Pentágono</label>
                            </div>
                            
                        <button (click)="area()" type="button" class="btn btn-primary">
                            Calcular Area
                        </button>
                    </form>
                </div>
                <div class="col-6">
                    <h3>Resultado: {{Fresultado}} </h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
